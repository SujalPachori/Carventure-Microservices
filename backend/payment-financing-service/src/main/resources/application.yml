spring:
  application:
    name: payment-financing-service

  datasource:
    url: jdbc:postgresql://localhost:5432/carventure_payments_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8082}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

car-service:
  base-url: ${CAR_SERVICE_URL:http://localhost:8081}

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000
  circuitbreaker:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      carService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound
  retry:
    instances:
      carService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - java.io.IOException
          - feign.RetryableException
        ignore-exceptions:
          - feign.FeignException$NotFound

payment:
  financing:
    default-down-payment-percent: 20
    default-tenure-months: 36
  kafka:
    topic:
      order-events: order-events
      car-sold-events: car-sold-events
  order-expiry:
    expiry-minutes: 30
    sweep-interval-ms: 300000
    sweep-initial-delay-ms: 60000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.autoplatform.payment: INFO

jwt:
  secret: ${JWT_SECRET}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false

internal:
  api:
    key: ${INTERNAL_API_KEY}