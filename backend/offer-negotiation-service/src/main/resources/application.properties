spring.application.name=offer-negotiation-service
server.port=8091

spring.datasource.url=jdbc:postgresql://localhost:5432/carventure_offer_prod
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
eureka.client.register-with-eureka = true
eureka.client.fetch-registry = true
eureka.instance.hostname = localhost
eureka.instance.prefer-ip-address=false
eureka.client.service-url.defaultZone = http://localhost:8761/eureka

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
jwt.secret=${JWT_SECRET}
spring.cloud.config.import-check.enabled=false
resilience4j.circuitbreaker.instances.carInventory.sliding-window-size=5
resilience4j.circuitbreaker.instances.carInventory.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.carInventory.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.carInventory.minimum-number-of-calls=3

resilience4j.circuitbreaker.instances.userManagement.sliding-window-size=5
resilience4j.circuitbreaker.instances.userManagement.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userManagement.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userManagement.minimum-number-of-calls=3

offer.reservation.expiry-minutes=${OFFER_RESERVATION_EXPIRY_MINUTES:10}
offer.reservation.sweep-interval-ms=${OFFER_RESERVATION_SWEEP_MS:300000}

internal.api.key=${INTERNAL_API_KEY}