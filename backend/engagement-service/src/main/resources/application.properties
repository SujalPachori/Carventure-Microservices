spring.application.name=engagement-service
server.port=8093

eureka.client.enabled=true
eureka.instance.prefer-ip-address=false
spring.datasource.url=jdbc:postgresql://localhost:5432/carventure_engagement_prod
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
eureka.client.register-with-eureka = true
eureka.client.fetch-registry = true
eureka.instance.hostname = localhost
eureka.client.service-url.defaultZone = http://localhost:8761/eureka
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET}
resilience4j.circuitbreaker.instances.carInventory.sliding-window-size=5
resilience4j.circuitbreaker.instances.carInventory.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.carInventory.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.carInventory.minimum-number-of-calls=3

spring.cloud.config.import-check.enabled=false
